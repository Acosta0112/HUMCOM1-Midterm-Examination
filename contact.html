<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acosta Midterm Portfolio | Contact</title>
    <link rel="stylesheet" href="myStyle.css">
</head>
<body>
    <header>
        <div class="logo">AC</div>
        <h1>Acosta Midterm Portfolio</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="media.html">Media</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section class="page-heading">
        <h1>Contact Details</h1>
       
    </section>

<main class="contact-card contact-form-card">
    <section class="contact-form-section">
        <h2>Send Us a Message</h2>
        <p>Fill out the form below and we will get back to you.</p>

        <form id="contactForm">
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label for="topic">Inquiry Topic</label>
            <select id="topic" name="topic" required>
                <option value="" disabled selected>Select a topic</option>
                <option value="graphic-design">Graphic Design</option>
                <option value="social-media">Social Media Content</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                placeholder="Write your message here..."
                required
            ></textarea>

            <button class="send-button" type="submit">Send Message</button>
            <p id="form-message" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>

    <footer>
        © Developed by Acosta Creatives | HUMAN-COMPUTER INTERACTION
    </footer>

    <script>
        const contactForm = document.getElementById("contactForm");
        const formMessage = document.getElementById("form-message");

        contactForm.addEventListener("submit", function(event) {
            event.preventDefault();
            formMessage.textContent = "Thank you! Your message has been recorded.";
            contactForm.reset();
        });
    </script>
</body>
</html>
